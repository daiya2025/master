<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>PLATEAU 千代田区 2025 LOD2 Capture</title>
  <script>window.CESIUM_BASE_URL = "/node_modules/cesium/Build/Cesium/";</script>
  <script src="/node_modules/cesium/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="/node_modules/cesium/Build/Cesium/Widgets/widgets.css" />
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #d8e2ea; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; }
    #cesiumContainer { position: fixed; inset: 0; }
    #status {
      position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
      color: #fff; background: #101820; font-size: 22px; letter-spacing: .08em;
    }
    #status.hidden { display: none; }
    #source {
      position: fixed; z-index: 10; left: 14px; bottom: 12px;
      padding: 6px 9px; border-radius: 5px;
      color: rgba(255,255,255,.94); background: rgba(0,0,0,.56);
      font-size: 11px; line-height: 1.35; letter-spacing: .01em;
      text-shadow: 0 1px 2px rgba(0,0,0,.7); pointer-events: none;
    }
    .cesium-viewer-bottom { bottom: 8px; right: 8px; }
    .cesium-widget-credits { font-size: 10px !important; background: rgba(0,0,0,.48) !important; padding: 3px 5px !important; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="status">LOD2 建築物モデルを読み込み中</div>
  <div id="source">出典：国土交通省 Project PLATEAU「千代田区 3D都市モデル（2025年度）」<br>建築物モデル LOD2 / 公式3D Tiles外部配信</div>

  <script>
    const TILESET_URL = "https://api.plateauview.mlit.go.jp/datacatalog/3dtiles/13101-bldg-lod2-2025/tileset.json";
    const GSI_ORTHO_URL = "https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg";
    const toRad = Cesium.Math.toRadians;
    const statusEl = document.getElementById("status");

    const viewer = new Cesium.Viewer("cesiumContainer", {
      animation: false,
      timeline: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      baseLayerPicker: false,
      navigationHelpButton: false,
      fullscreenButton: false,
      infoBox: false,
      selectionIndicator: false,
      baseLayer: false,
      terrainProvider: new Cesium.EllipsoidTerrainProvider(),
      requestRenderMode: false,
      shouldAnimate: false,
      targetFrameRate: 30
    });

    viewer.resolutionScale = 1.0;
    viewer.scene.backgroundColor = Cesium.Color.fromCssColorString("#d8e2ea");
    viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#d7d8d2");
    viewer.scene.globe.enableLighting = false;
    viewer.scene.globe.depthTestAgainstTerrain = false;
    viewer.scene.fog.enabled = true;
    viewer.scene.fog.density = 0.00018;
    viewer.scene.skyAtmosphere.show = true;
    viewer.scene.highDynamicRange = true;
    viewer.scene.postProcessStages.fxaa.enabled = true;
    if (viewer.scene.msaaSupported) viewer.scene.msaaSamples = 4;
    viewer.scene.screenSpaceCameraController.enableCollisionDetection = false;
    viewer.clock.currentTime = Cesium.JulianDate.fromIso8601("2025-04-15T03:00:00Z");

    viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
      url: GSI_ORTHO_URL,
      maximumLevel: 18,
      credit: new Cesium.Credit("地理院タイル（全国最新写真）")
    }));

    const WAYPOINTS = [
      { t: 0.0,  lon: 139.7584, lat: 35.6861, h: 30, range: 5000, heading: 312, pitch: -47 },
      { t: 5.0,  lon: 139.7584, lat: 35.6861, h: 30, range: 4400, heading: 325, pitch: -44 },
      { t: 13.0, lon: 139.7673, lat: 35.6813, h: 25, range: 1450, heading: 238, pitch: -31 },
      { t: 21.0, lon: 139.7608, lat: 35.6819, h: 25, range: 1050, heading: 103, pitch: -25 },
      { t: 30.0, lon: 139.7538, lat: 35.6854, h: 20, range: 2200, heading: 142, pitch: -48 },
      { t: 39.0, lon: 139.7457, lat: 35.6759, h: 25, range: 1280, heading: 24,  pitch: -30 },
      { t: 48.0, lon: 139.7719, lat: 35.6974, h: 25, range: 1220, heading: 214, pitch: -31 },
      { t: 56.0, lon: 139.7592, lat: 35.6863, h: 30, range: 3500, heading: 42,  pitch: -44 },
      { t: 64.0, lon: 139.7592, lat: 35.6863, h: 30, range: 5000, heading: 132, pitch: -49 }
    ];

    function smoothstep(x) {
      x = Math.max(0, Math.min(1, x));
      return x * x * (3 - 2 * x);
    }

    function lerp(a, b, u) { return a + (b - a) * u; }

    function lerpAngleDegrees(a, b, u) {
      let delta = ((b - a + 540) % 360) - 180;
      return a + delta * u;
    }

    function setCamera(p) {
      const target = Cesium.Cartesian3.fromDegrees(p.lon, p.lat, p.h || 0);
      viewer.camera.lookAt(target, new Cesium.HeadingPitchRange(
        toRad(p.heading), toRad(p.pitch), p.range
      ));
    }

    function cameraAtTime(seconds) {
      if (seconds <= WAYPOINTS[0].t) return WAYPOINTS[0];
      if (seconds >= WAYPOINTS[WAYPOINTS.length - 1].t) return WAYPOINTS[WAYPOINTS.length - 1];
      let i = 0;
      while (i < WAYPOINTS.length - 2 && seconds > WAYPOINTS[i + 1].t) i++;
      const a = WAYPOINTS[i];
      const b = WAYPOINTS[i + 1];
      const u = smoothstep((seconds - a.t) / (b.t - a.t));
      return {
        lon: lerp(a.lon, b.lon, u),
        lat: lerp(a.lat, b.lat, u),
        h: lerp(a.h, b.h, u),
        range: lerp(a.range, b.range, u),
        heading: lerpAngleDegrees(a.heading, b.heading, u),
        pitch: lerp(a.pitch, b.pitch, u)
      };
    }

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    async function waitForTilesStable(maxMs = 16000) {
      const started = performance.now();
      let stableChecks = 0;
      while (performance.now() - started < maxMs) {
        viewer.scene.requestRender();
        if (window.__tileset && window.__tileset.tilesLoaded) stableChecks += 1;
        else stableChecks = 0;
        if (stableChecks >= 4) break;
        await sleep(500);
      }
      await sleep(1000);
    }

    window.preloadWaypoints = async function preloadWaypoints() {
      const preloadIndices = [0, 2, 3, 4, 5, 6, 7];
      for (let n = 0; n < preloadIndices.length; n++) {
        statusEl.textContent = `LOD2 表示範囲を準備中 ${n + 1} / ${preloadIndices.length}`;
        setCamera(WAYPOINTS[preloadIndices[n]]);
        await waitForTilesStable(16000);
      }
      setCamera(WAYPOINTS[0]);
      await waitForTilesStable(12000);
      statusEl.classList.add("hidden");
      window.__preloaded = true;
      return true;
    };

    window.startTour = function startTour() {
      statusEl.classList.add("hidden");
      setCamera(WAYPOINTS[0]);
      const durationMs = 64000;
      window.__tourDone = false;
      return new Promise(resolve => {
        const start = performance.now();
        function frame(now) {
          const elapsed = Math.min(durationMs, now - start);
          setCamera(cameraAtTime(elapsed / 1000));
          viewer.scene.requestRender();
          if (elapsed < durationMs) requestAnimationFrame(frame);
          else {
            setCamera(WAYPOINTS[WAYPOINTS.length - 1]);
            window.__tourDone = true;
            resolve(true);
          }
        }
        requestAnimationFrame(frame);
      });
    };

    (async () => {
      try {
        const tileset = await Cesium.Cesium3DTileset.fromUrl(TILESET_URL, {
          maximumScreenSpaceError: 10,
          cacheBytes: 805306368,
          maximumCacheOverflowBytes: 268435456,
          cullWithChildrenBounds: true,
          preferLeaves: true,
          preloadWhenHidden: false,
          preloadFlightDestinations: true,
          dynamicScreenSpaceError: true,
          dynamicScreenSpaceErrorDensity: 0.00278,
          dynamicScreenSpaceErrorFactor: 3.0
        });
        viewer.scene.primitives.add(tileset);
        window.__tileset = tileset;
        setCamera(WAYPOINTS[0]);
        window.__ready = true;
        window.__dataSourceUrl = TILESET_URL;
      } catch (error) {
        console.error("PLATEAU tileset load failed", error);
        statusEl.textContent = "LOD2 建築物モデルの読み込みに失敗しました";
        window.__loadError = String(error && error.stack ? error.stack : error);
      }
    })();
  </script>
</body>
</html>
