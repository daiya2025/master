name: Capture Chiyoda PLATEAU LOD2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install

      - name: Install Chromium and FFmpeg
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Record official externally distributed LOD2 tiles
        run: npm run capture

      - name: Encode exactly 60 seconds with source attribution
        run: |
          ffmpeg -y \
            -i raw-tour.webm \
            -t 60 \
            -vf "fps=30,scale=1920:1080:flags=lanczos,drawbox=x=14:y=ih-58:w=1020:h=44:color=black@0.50:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Source\: MLIT Project PLATEAU / Chiyoda-ku 2025 / Building LOD2':fontcolor=white:fontsize=22:x=25:y=h-th-25,format=yuv420p" \
            -c:v libx264 \
            -preset medium \
            -crf 18 \
            -movflags +faststart \
            -an \
            chiyoda_plateau_2025_lod2_direct_capture_60sec.mp4
          ffprobe -v error \
            -show_entries format=duration,size:stream=codec_name,width,height,avg_frame_rate,nb_frames \
            -of json \
            chiyoda_plateau_2025_lod2_direct_capture_60sec.mp4 > output-probe.json
          cat output-probe.json

      - name: Upload capture and verification files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chiyoda-plateau-lod2-capture
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
          path: |
            chiyoda_plateau_2025_lod2_direct_capture_60sec.mp4
            raw-tour.webm
            qc-loaded.png
            qc-final.png
            capture-meta.json
            output-probe.json
            tileset-probe.json
            tileset-probe-summary.json
            browser-console.log
            request-failures.log
            capture-error.txt
